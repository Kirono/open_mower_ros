#Length = 52 cm
#Width = 34 cm
#Center of rotation = 14 cm from the back
#14 cm behind the center (-0.14 m)
#38 cm in front (0.38 m, because 52 - 14 = 38 cm)
#Widthwise: ±17 cm (±0.17 m)
footprint: [ [-0.14, -0.19], [-0.14, 0.19], [0.36, 0.19], [0.43, 0.15], [0.43, -0.15], [0.36, -0.19] ]
#robot_radius: 0.0

global_frame: map
robot_base_frame: base_link

plugins:
- name: static_layer
  type: costmap_2d::StaticLayer
- name: obstacle_layer
  type: costmap_2d::ObstacleLayer
- name: inflation_layer
  type: costmap_2d::InflationLayer

static_layer:
  map_topic: mower_map_service/map
  trinary_costmap: false
obstacle_layer:
  max_obstacle_height: 1.0
  obstacle_range: 3.0
  raytrace_range: 4.0
